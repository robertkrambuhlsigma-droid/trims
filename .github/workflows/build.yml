name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: trimpreview-jar
          path: build/libs/trimpreview-1.0.0.jar

      - name: Dump trim API (debug)
        if: failure()
        run: |
          find ~/.gradle -name "*.jar" | while read j; do
            if unzip -l "$j" 2>/dev/null | grep -q 'equipment/trim/TrimPattern.class'; then
              echo "== $j"
              javap -p -cp "$j" net.minecraft.world.item.equipment.trim.TrimPattern net.minecraft.world.item.equipment.trim.TrimMaterial
            fi
          done
