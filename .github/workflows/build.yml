name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: trimpreview-jar
          path: build/libs/trimpreview-*.jar

      - name: Dump trim API (debug)
        if: always()
        run: |
          set +e
          find ~/.gradle -name "*.jar" | while read j; do
            if unzip -l "$j" 2>/dev/null | grep -q 'equipment/trim/TrimPattern.class'; then
              echo "== $j"
              javap -p -cp "$j" net.minecraft.world.item.equipment.trim.TrimPattern net.minecraft.world.item.equipment.trim.TrimMaterial
              javap -p -cp "$j" net.minecraft.client.gui.screens.inventory.InventoryScreen net.minecraft.client.gui.GuiGraphicsExtractor | grep -i "entity\|item\|fill\|text"
              javap -p -cp "$j" net.minecraft.world.entity.decoration.ArmorStand | grep -i "equip\|ArmorStand(\|setShow\|Arms"
              javap -p -cp "$j" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | grep -i "extract\|render\|init"
              javap -p -cp "$j" net.minecraft.client.gui.components.Button | grep -i "builder\|class"
              javap -p -cp "$j" net.minecraft.world.item.equipment.trim.ArmorTrim | grep -i "ArmorTrim("
              javap -p -cp "$j" net.minecraft.world.inventory.AbstractContainerMenu | grep -i "moveItemStackTo\|clearContainer\|broadcastChanges\|removed\|stillValid"
              javap -p -cp "$j" net.minecraft.world.inventory.Slot | grep -i "mayPlace\|onTake\|setChanged\|set("
              javap -p -cp "$j" net.minecraft.world.entity.player.Inventory | grep -i "countItem\|setChanged\|getContainerSize"
              javap -p -cp "$j" net.minecraft.world.level.block.Blocks | grep -i smithing
            fi
          done
