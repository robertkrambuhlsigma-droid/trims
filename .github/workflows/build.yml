name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'   # VERIFY: Loom 1.9 needs Gradle 8.10+

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: trimpreview-jar
          path: build/libs/trimpreview-1.0.0.jar
